name: Generate Podcast Feed
on:
  push:
    branches:
      - main
  workflow_dispatch:
jobs:
  generate-feed:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v3
      - name: Generate feed.yaml
        uses: luca-gatty-main/gh_actions@main
        with:
          feed_file: feed.yaml
          email: "${{ github.actor }}@users.noreply.github.com"
          name: "${{ github.actor }}"